<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ChipShip</title>

    <link rel="stylesheet" href="css_files/style.css">
    <link rel="stylesheet" href="css_files/login.css">
    <link rel="stylesheet" href="css_files/nav_style.css">
    <link rel="stylesheet" href="css_files/footer_style.css">
</head>

<body>

    <header class="navbar">

        <div class="navbar_left-side">

            <div class="navbar_logo">
                <img src="images/logo.png" class="logo" alt="ChipShip Logo">
                <p id="storeName">ChipShip</p>
            </div>

        </div>

    </header>

    <main>

        <div class="login_content">

            <div class="login_box">

                <h1>Welcome Back</h1>

                <p class="login_subtext">
                    Login to your ChipShip account
                </p>

                <form class="login_form" novalidate>

                    <div class="input_group">
                        <label for="loginEmail">Email</label>
                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                        <small class="error"></small>
                    </div>

                    <div class="input_group">
                        <label for="loginPassword">Password</label>
                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <small class="error"></small>
                    </div>

                    <!-- <div class="login_options">
                        <a href="#" class="forgot_password">
                            Forgot password?
                        </a>
                    </div> -->

                    <button type="submit" class="login_btn">
                        Login
                    </button>

                    <p class="register_link">
                        Don’t have an account?
                        <a href="register.html">Register</a>
                    </p>

                </form>

            </div>

        </div>

    </main>

    <footer>

        <div class="footer-content">
            <p>Copyright © 2026 ChipShip Store</p>
        </div>

    </footer>

    <script type="module" src="js_files/login.js"></script>

</body>

</html>
