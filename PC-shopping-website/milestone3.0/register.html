<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | ChipShip</title>

    <link rel="stylesheet" href="css_files/style.css">
    <link rel="stylesheet" href="css_files/register.css">
</head>

<body>

<header class="navbar">

    <div class="navbar_left-side">

        <div class="navbar_logo">
            <img src="images/logo.png" class="logo" alt="ChipShip Logo">
            <p id="storeName">ChipShip</p>
        </div>

    </div>

</header>

<main>

    <div class="register_content">

        <div class="register_box">

            <h1>Create Account</h1>

            <p class="register_subtext">
                Join ChipShip and start shopping!
            </p>

            <form class="register_form">

                <div class="name_row">

                    <div class="input_group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" placeholder="First name" autocomplete="given-name">
                        <small class="error"></small>
                    </div>

                    <div class="input_group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" placeholder="Last name" autocomplete="family-name">
                        <small class="error"></small>
                    </div>

                </div>

                <div class="input_group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>
                    <small class="error"></small>
                </div>

                <div class="input_group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" autocomplete="new-password">
                    <small class="error"></small>
                </div>

                <div class="input_group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" placeholder="Confirm your password" autocomplete="new-password">
                    <small class="error"></small>
                </div>

                <button type="submit" class="register_btn">Register</button>

                <p class="login_link">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </form>

        </div>

    </div>

</main>

<footer>

    <div class="footer-content">
        <p>Copyright © 2026 ChipShip Store</p>
    </div>

</footer>

<script type="module" src="js_files/register.js"></script>

</body>

</html>
