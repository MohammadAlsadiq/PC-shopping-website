<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Details | ChipShip</title>

    <link rel="stylesheet" href="css_files/style.css">
    <link rel="stylesheet" href="css_files/css-navbar_files/profile-dropdown.css">
    <link rel="stylesheet" href="css_files/nav_style.css">
    <link rel="stylesheet" href="css_files/footer_style.css">
    <link rel="stylesheet" href="css_files/product-detail.css">
</head>

<body>

    <div id="navbar-placeholder"></div>

    <main>
        <section class="product-detail_content">

            <p id="productError" class="product-error"></p>

            <div class="product-detail-card">

                <a class="product-help-link" href="contact-us.html">Help</a>

                <div class="product-detail-left">
                    <h1 id="productName">Loading product...</h1>

                    <h2>Product Details</h2>

                    <div id="productDetails" class="product-details-text">
                        Loading details...
                    </div>

                    <div class="purchase-box">
                        <div class="price-action-row">
                            <p id="productPrice" class="product-price">$0.00</p>

                            <button id="addToCartBtn" class="add-cart-btn" type="button">
                                Add to Cart
                            </button>
                        </div>
                    </div>
                </div>

                <div class="product-detail-right">
                    <img id="productImage" src="images/logo.png" alt="Product image">
                </div>

            </div>

        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="js_files/load-layout.js"></script>
    <script type="module" src="js_files/product-detail.js"></script>
    <script type="module" src="js_files/auth.js"></script>
    <script type="module" src="js_files/js-navbar_files/profile-icon.js"></script>

</body>
</html>
